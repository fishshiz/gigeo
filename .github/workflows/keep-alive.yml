name: Keep-alive

# Render's free tier spins the API down after 15 minutes of inactivity,
# leaving a 5-10s cold start on the next real visit. Pinging /api/health
# well inside that window keeps it warm. GitHub auto-disables scheduled
# workflows after 60 days with no commits to the repo — if pings stop
# firing, that's why; a push to main re-enables it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 30 https://gigeo-web.onrender.com/api/health
