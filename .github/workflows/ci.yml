name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - run: cargo fmt --check
      - run: cargo check --bins
      # Scoped to clippy's own lints (clippy::all), not rustc's built-in
      # ones (dead_code, non_snake_case, ...) — those track pre-existing
      # debt (e.g. structs mirroring Ticketmaster's raw camelCase JSON)
      # that isn't part of this gate.
      - run: cargo clippy --bins --tests -- -D clippy::all
      - run: cargo test --lib

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      - run: pnpm turbo test --filter web
      - run: pnpm turbo build --filter web
