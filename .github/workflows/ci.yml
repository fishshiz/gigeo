name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      SQLX_OFFLINE: "true"
    # Only `cargo test --lib` needs this — it's how `#[sqlx::test]` tests
    # (e.g. artists/db.rs) get a real Postgres to spin up ephemeral,
    # per-test databases against. The build/check/clippy steps above stay
    # on SQLX_OFFLINE's cached .sqlx query metadata and never touch it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - run: cargo fmt --check
      - run: cargo check --bins
      # Scoped to clippy's own lints (clippy::all), not rustc's built-in
      # ones (dead_code, non_snake_case, ...) — those track pre-existing
      # debt (e.g. structs mirroring Ticketmaster's raw camelCase JSON)
      # that isn't part of this gate.
      - run: cargo clippy --bins --tests -- -D clippy::all
      - run: cargo test --lib
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      - run: pnpm turbo test --filter web
      - run: pnpm turbo build --filter web
