[package]
name = "gigeo_api"
version = "0.1.0"
edition = "2024"
default-run = "gigeo_api"


[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }


reqwest = { version = "0.13", features = ["json"] }


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async trait support
async-trait = "0.1"

# Hashing for external_id generation
sha2 = "0.10"
hex = "0.4"
geojson = "1.0.0"
geohash = "0.13.1"

base64 = "0.22"
rand = "0.8"
axum-extra = { version = "0.12", features = ["query"] }
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["cors", "trace"] }


vercel_runtime = { version = "2", features = ["axum"] }
tower-service = "0.3.3"
tower = "0.5.3"

