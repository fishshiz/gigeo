[package]
name = "gigeo-api"
version = "0.1.0"
edition = "2021"


[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate"] }

reqwest = { version = "0.13", features = ["json"] }

# Regex for JSON extraction from HTML
regex = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async trait support
async-trait = "0.1"

# Hashing for external_id generation
sha2 = "0.10"
hex = "0.4"
geojson = "1.0.0"
geohash = "0.13.1"
